<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eigene Startseite</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <!-- Haupt-Layout: Ordnet Tabelle (links) und Dashboard (rechts) nebeneinander an -->
  <div class="app-layout">

    <!-- LINKS: Livetabelle -->
    <aside class="sidebar-widget">
      <div class="fussballde_widget"
          data-id="e9369c47-ed49-4d65-a503-549de0bc0c42"
          data-type="table">
      </div>
    </aside>

    <!-- RECHTS: Uhr, Wetter, Suche & Shortcuts -->
    <div class="container">
      
      <!-- Haupt-Widget für Uhr, Datum, Stadt & Wetter -->
      <div class="header-widget">
        <div class="location" id="location">📍 Chemnitz</div>
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">Lade Datum...</div>
        <div class="weather" id="weather">Wetter wird geladen...</div>
      </div>

      <!-- Google Suche -->
      <form action="https://www.google.com/search" method="get" target="_blank" class="search-form">
        <input type="text" name="q" class="search-input" placeholder="Auf Google suchen..." autofocus>
      </form>

      <!-- Schnellzugriffe -->
      <div class="shortcuts">
        <a href="https://www.youtube.com/@xBurzelx" class="shortcut" target="_blank" rel="noopener">
          <span class="shortcut-icon">
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="YouTube">
          </span>
          <span class="shortcut-title">YouTube</span>
        </a>

        <a href="https://github.com/xBurzelx" class="shortcut" target="_blank" rel="noopener">
          <span class="shortcut-icon">
            <img src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt="GitHub">
          </span>
          <span class="shortcut-title">GitHub</span>
        </a>

        <a href="https://sortitoutsi.net/" class="shortcut" target="_blank" rel="noopener">
          <span class="shortcut-icon">
            <img src="https://www.google.com/s2/favicons?domain=sortitoutsi.net&sz=64" alt="sortitoutsi">
          </span>
          <span class="shortcut-title">sortitoutsi</span>
        </a>

        <a href="https://www.chemnitzerfc.de/cfc/home" class="shortcut" target="_blank" rel="noopener">
          <span class="shortcut-icon">
            <img src="https://www.google.com/s2/favicons?domain=chemnitzerfc.de&sz=64" alt="Chemnitzer FC">
          </span>
          <span class="shortcut-title">Chemnitzer FC</span>
        </a>

        <a href="https://www.gran-turismo.com/de/gt7/user/mymenu/ff39bab4-7ac1-40df-b89c-e2886e4afd78/profile" class="shortcut" target="_blank" rel="noopener">
          <span class="shortcut-icon">
            <img src="https://www.google.com/s2/favicons?domain=gran-turismo.com&sz=64" alt="Gran Turismo">
          </span>
          <span class="shortcut-title">Gran Turismo</span>
        </a>

        <a href="https://retroachievements.org/user/xBurzelx" class="shortcut" target="_blank" rel="noopener">
          <span class="shortcut-icon">
            <img src="https://www.google.com/s2/favicons?domain=retroachievements.org&sz=64" alt="RetroAchievements">
          </span>
          <span class="shortcut-title">RetroAchievements</span>
        </a>

        <a href="https://xburzelx.github.io/xBurzelx---FM27-webseite/" class="shortcut" target="_blank" rel="noopener">
          <span class="shortcut-icon">
            <img src="https://www.google.com/s2/favicons?domain=xburzelx.github.io&sz=64" alt="FM27 Trainerstory">
          </span>
          <span class="shortcut-title">FM27 Trainerstory</span>
        </a>

      </div>

    </div>

  </div>

  <!-- FUSSBALL.DE Skript -->
  <script type="text/javascript" src="https://www.fussball.de/widgets.js"></script>

</body>
</html>
